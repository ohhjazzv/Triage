<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triage thumbnail (1500 x 1000)</title>
<link rel="stylesheet" href="thumbnail.css">
</head>
<body>
<main class="thumb">
  <div class="left">
    <p class="brand"><span class="mark"><i></i><i></i><i></i></span>Triage</p>
    <h1>What to skip.<br>When to stop.</h1>
    <p class="sub">Exam tomorrow. 12 chapters. 4 hours.<br>Every square is one mark.</p>
    <ul class="legend">
      <li><span class="sq have"></span>have now</li>
      <li><span class="sq win"></span>tonight</li>
      <li><span class="sq later"></span>later</li>
    </ul>
  </div>
  <div class="right" id="map"></div>
</main>
<script src="thumbnail.js"></script>
</body>
</html>
